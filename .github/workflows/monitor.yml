name: Monitor Zambia Store Catalogues

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @modelcontextprotocol/sdk @neondatabase/serverless pdf-lib node-fetch

      - name: Run catalogue monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMARTTROLI_GITHUB_TOKEN: ${{ secrets.SMARTTROLI_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/monitor.js

      - name: Check price alerts
        run: |
          curl -sS -X GET "https://www.smarttroli.com/api/alerts/check" \
            -H "Accept: application/json" \
            --max-time 120 \
            --retry 2 --retry-delay 5 \
            -w "\nHTTP %{http_code}\n"
